name: Distribuer aux testeurs

on:
  # Build automatique à chaque push sur la branche de travail
  push:
    branches:
      - claude/mysteria-communicator-app-gLKtX
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/distribute.yml'
  # Build manuel depuis l'onglet Actions
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Notes de version (optionnel)"
        required: false
        default: "Build manuel"

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Compile et distribue
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Installer Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Distribuer aux testeurs
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="${{ github.event.head_commit.message }}"
          fi
          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app 1:524991158322:android:fc495464704d835440442b \
            --groups "testeurs" \
            --release-notes "$NOTES"

      - name: Archiver l'APK dans le run GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mysteria-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
